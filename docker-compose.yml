services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pace
      MYSQL_USER: pace
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pace}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - pace-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD""]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pace-mysql-data:
